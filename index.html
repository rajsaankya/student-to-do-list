
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <header>
            <h1>📚 Student To-Do List</h1>
            <p>Organize your day. Achieve your goals!</p>
        </header>

        <div class="stats">
            <div class="stat-card">
                <h2 id="totalTasks">0</h2>
                <p>Total Tasks</p>
            </div>

            <div class="stat-card">
                <h2 id="completedTasks">0</h2>
                <p>Completed</p>
            </div>

            <div class="stat-card">
                <h2 id="pendingTasks">0</h2>
                <p>Pending</p>
            </div>
        </div>

        <div class="task-input">
            <h2>Add Your Task</h2>

            <input type="text" id="taskInput"
                placeholder="Enter your task...">

            <input type="date" id="taskDate">

            <button onclick="addTask()">+ Add Task</button>
        </div>

        <div class="task-section">
            <h2>My Tasks</h2>

            <div class="filters">
                <button onclick="filterTasks('all')">All</button>
                <button onclick="filterTasks('pending')">Pending</button>
                <button onclick="filterTasks('completed')">Completed</button>
            </div>

            <ul id="taskList"></ul>
        </div>

        <footer>
            <p>Stay Focused | Stay Organized | Stay Successful ✨</p>
        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
